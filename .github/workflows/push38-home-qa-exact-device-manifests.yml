name: PUSH 38 exact-device Home QA manifests

on:
  push:
    branches: [codex/push-38-aws-signing]
    paths:
      - .github/workflows/push38-home-qa-exact-device-manifests.yml

permissions: {}
concurrency:
  group: push38-home-qa-health-corrected-exact-device-manifests
  cancel-in-progress: false

jobs:
  issue-exact-device-manifests:
    if: github.repository == 'infoganbatuah-ai/gan-batuach' && github.ref == 'refs/heads/codex/push-38-aws-signing'
    environment: HOME_QA_SIGNING
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b47c09c21fd3ea9a9d7e24b13e423e628a1413c4
          persist-credentials: false
      - name: Require the reviewed qualification candidate
        env:
          PUSH38_CANDIDATE_SHA: b47c09c21fd3ea9a9d7e24b13e423e628a1413c4
        run: test "$(git rev-parse HEAD)" = "$PUSH38_CANDIDATE_SHA"
      - name: Verify exact-device issuance contract
        run: |
          node scripts/qa/check-push38-home-qa-manifests.mjs
          node scripts/qa/check-push38-home-qa-issuance.mjs
          node scripts/qa/check-remote-edge-signer.mjs
      - name: Assume exact protected release-signing role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: homeqa-release-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 2
          unset-current-credentials: true
      - name: Sign exactly three fixed Home QA device manifests
        env:
          SIGNER_KEY_ARN: ${{ vars.AWS_KEY_ARN }}
          SIGNER_KEY_ID: ${{ vars.SIGNER_KEY_ID }}
          SIGNER_PUBLIC_KEY_SHA256: ${{ vars.SIGNER_PUBLIC_KEY_SHA256 }}
          PUSH38_CANDIDATE_SHA: b47c09c21fd3ea9a9d7e24b13e423e628a1413c4
          HOME_QA_R2_ORIGIN: https://693f824a750afcc264fe6ee58c8a86ab.r2.cloudflarestorage.com
          HOME_QA_OUTPUT_DIR: ${{ runner.temp }}/push38-homeqa-exact-device-manifests
        run: node scripts/release/issue-push38-home-qa-manifests.mjs
      - name: Preserve signed public manifests and redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: push38-homeqa-exact-device-manifests-${{ github.run_id }}
          path: ${{ runner.temp }}/push38-homeqa-exact-device-manifests/
          if-no-files-found: error
          retention-days: 7
