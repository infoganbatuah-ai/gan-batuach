name: PUSH 38 Connector RTSP handoff Home QA manifest

on:
  push:
    branches: [codex/push-38-aws-signing]
    paths:
      - .github/workflows/push38-home-qa-connector-rtsp-handoff.yml

permissions: {}
concurrency:
  group: push38-home-qa-connector-rtsp-handoff-manifest
  cancel-in-progress: false

jobs:
  issue-connector-rtsp-handoff-manifest:
    if: github.repository == 'infoganbatuah-ai/gan-batuach' && github.ref == 'refs/heads/codex/push-38-aws-signing'
    environment: HOME_QA_SIGNING
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b402289d56c323e794803a8db7d651ab89354043
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require the reviewed qualification tooling
        run: test "$(git rev-parse HEAD)" = "b402289d56c323e794803a8db7d651ab89354043"
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Verify immutable RTSP handoff contract
        run: |
          node scripts/qa/check-push38-connector-rtsp-handoff.mjs
          node scripts/qa/check-push38-connector-rtsp-session-recovery.mjs
          node scripts/qa/check-push38-connector-relay-backoff.mjs
          node scripts/qa/check-edge-runtime-liveness.mjs
          node scripts/qa/check-software-connector.mjs
          node scripts/qa/check-edge-ota-update.mjs
          node scripts/qa/check-remote-edge-signer.mjs
          node scripts/qa/check-installed-ota-health-truth.mjs
      - name: Assume exact protected release-signing role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: homeqa-connector-rtsp-handoff-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 2
          unset-current-credentials: true
      - name: Sign exact-device Connector RTSP handoff manifest
        env:
          SIGNER_KEY_ARN: ${{ vars.AWS_KEY_ARN }}
          SIGNER_KEY_ID: ${{ vars.SIGNER_KEY_ID }}
          SIGNER_PUBLIC_KEY_SHA256: ${{ vars.SIGNER_PUBLIC_KEY_SHA256 }}
          PUSH38_CANDIDATE_SHA: a5c3dc51a7f4e3d6bc4a8cbb2d585a85a6e31fa7
          HOME_QA_R2_ORIGIN: https://693f824a750afcc264fe6ee58c8a86ab.r2.cloudflarestorage.com
          HOME_QA_OUTPUT_DIR: ${{ runner.temp }}/push38-homeqa-connector-rtsp-handoff
        run: node scripts/release/issue-push38-home-qa-connector-rtsp-handoff.mjs
      - name: Preserve signed public manifest and redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: push38-homeqa-connector-rtsp-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/push38-homeqa-connector-rtsp-handoff/
          if-no-files-found: error
          retention-days: 7
