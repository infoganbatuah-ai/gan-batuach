name: Protected KMS custody proof

on:
  workflow_dispatch:
  push:
    branches: [codex/push-38-aws-signing]
    paths:
      - .github/workflows/kms-custody-proof.yml
      - scripts/qa/check-live-kms-custody.mjs

permissions: {}
concurrency:
  group: protected-kms-custody-proof
  cancel-in-progress: false

jobs:
  custody:
    if: github.repository == 'infoganbatuah-ai/gan-batuach' && github.ref == 'refs/heads/codex/push-38-aws-signing'
    strategy:
      fail-fast: false
      matrix:
        environment: [ROOT_TRUST_SIGNING, HOME_QA_SIGNING]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assume owner-reviewed exact-key role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: custody-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 2
          unset-current-credentials: true
      - name: Provider-backed proof (no release publication or runtime changes)
        env:
          SIGNER_KEY_ARN: ${{ vars.AWS_KEY_ARN }}
          SIGNER_KEY_ID: ${{ vars.SIGNER_KEY_ID }}
          SIGNER_PUBLIC_KEY_SHA256: ${{ vars.SIGNER_PUBLIC_KEY_SHA256 }}
          DENIED_KEY_ARN: ${{ vars.KMS_DENIED_KEY_ARN }}
          PROOF_ENVIRONMENT: ${{ matrix.environment }}
        run: node scripts/qa/check-live-kms-custody.mjs
