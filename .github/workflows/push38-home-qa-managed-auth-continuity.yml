name: PUSH 38 managed-auth continuity Home QA manifests

on:
  push:
    branches: [codex/push-38-aws-signing]
    paths:
      - .github/workflows/push38-home-qa-managed-auth-continuity.yml

permissions: {}
concurrency:
  group: push38-home-qa-managed-auth-continuity-manifests
  cancel-in-progress: false

jobs:
  issue-managed-auth-continuity-manifests:
    if: github.repository == 'infoganbatuah-ai/gan-batuach' && github.ref == 'refs/heads/codex/push-38-aws-signing'
    environment: HOME_QA_SIGNING
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: eb5d196a5fad11370523ec5163d15adefb56b8ca
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require reviewed qualification tooling
        run: test "$(git rev-parse HEAD)" = "eb5d196a5fad11370523ec5163d15adefb56b8ca"
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Verify immutable paired release contract
        run: |
          node scripts/qa/check-push38-managed-auth-continuity-release.mjs
          node --test scripts/qa/gateway-device-refresh.test.mjs
          node scripts/qa/check-push38-home-qa-phases.mjs
          node scripts/qa/check-edge-ota-update.mjs
          node scripts/qa/check-remote-edge-signer.mjs
      - name: Assume exact protected release-signing role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: homeqa-managed-auth-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 2
          unset-current-credentials: true
      - name: Sign exact-device managed-auth continuity manifests
        env:
          SIGNER_KEY_ARN: ${{ vars.AWS_KEY_ARN }}
          SIGNER_KEY_ID: ${{ vars.SIGNER_KEY_ID }}
          SIGNER_PUBLIC_KEY_SHA256: ${{ vars.SIGNER_PUBLIC_KEY_SHA256 }}
          PUSH38_CANDIDATE_SHA: 25b9affba6fad2c019c56b8d49ef3c2c25f554e4
          HOME_QA_COMPONENT: gateway
          HOME_QA_R2_ORIGIN: https://693f824a750afcc264fe6ee58c8a86ab.r2.cloudflarestorage.com
          HOME_QA_OUTPUT_DIR: ${{ runner.temp }}/push38-homeqa-managed-auth-continuity
        run: node scripts/release/issue-push38-home-qa-managed-auth-continuity.mjs
      - name: Preserve signed public manifests and redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: push38-homeqa-managed-auth-continuity-${{ github.run_id }}
          path: ${{ runner.temp }}/push38-homeqa-managed-auth-continuity/
          if-no-files-found: error
          retention-days: 7
