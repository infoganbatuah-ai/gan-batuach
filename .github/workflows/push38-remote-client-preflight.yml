name: PUSH 38 remote-client IPv6 preflight

on:
  push:
    branches:
      - codex/push-38t-qualification
    paths:
      - .github/workflows/push38-remote-client-preflight.yml
      - scripts/qa/check-push38-remote-client-ipv6.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push38-remote-client-preflight
  cancel-in-progress: true

jobs:
  ipv6-client:
    name: Separate remote client IPv6/TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify outbound IPv6 over TLS
        run: node scripts/qa/check-push38-remote-client-ipv6.mjs
