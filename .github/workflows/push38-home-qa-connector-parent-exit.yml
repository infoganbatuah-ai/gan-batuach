name: PUSH 38 Connector parent-exit recovery Home QA manifest

on:
  push:
    branches: [codex/push-38-aws-signing]
    paths:
      - .github/workflows/push38-home-qa-connector-parent-exit.yml

permissions: {}
concurrency:
  group: push38-home-qa-connector-parent-exit-manifest
  cancel-in-progress: false

jobs:
  issue-connector-parent-exit-recovery-manifest:
    if: github.repository == 'infoganbatuah-ai/gan-batuach' && github.ref == 'refs/heads/codex/push-38-aws-signing'
    environment: HOME_QA_SIGNING
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 21984901e6c18a267fa2e01121786441acc39dd6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require the reviewed qualification tooling
        run: test "$(git rev-parse HEAD)" = "21984901e6c18a267fa2e01121786441acc39dd6"
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Verify immutable parent-exit recovery issuance contract
        run: |
          node scripts/qa/check-push38-home-qa-issuance.mjs
          node scripts/qa/check-edge-ota-update.mjs
          node scripts/qa/check-remote-edge-signer.mjs
          node scripts/qa/check-installed-ota-health-truth.mjs
          node scripts/qa/check-edge-runtime-liveness.mjs
          node scripts/qa/check-edge-parent-shutdown.mjs
      - name: Assume exact protected release-signing role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: homeqa-parent-exit-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 2
          unset-current-credentials: true
      - name: Sign exact-device Connector parent-exit recovery manifest
        env:
          SIGNER_KEY_ARN: ${{ vars.AWS_KEY_ARN }}
          SIGNER_KEY_ID: ${{ vars.SIGNER_KEY_ID }}
          SIGNER_PUBLIC_KEY_SHA256: ${{ vars.SIGNER_PUBLIC_KEY_SHA256 }}
          PUSH38_CANDIDATE_SHA: 91569afa630610d842be70f3fed1c9e98a9f9641
          HOME_QA_R2_ORIGIN: https://693f824a750afcc264fe6ee58c8a86ab.r2.cloudflarestorage.com
          HOME_QA_OUTPUT_DIR: ${{ runner.temp }}/push38-homeqa-connector-parent-exit
        run: node scripts/release/issue-push38-home-qa-connector-parent-exit.mjs
      - name: Preserve signed public manifest and redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: push38-homeqa-connector-parent-exit-${{ github.run_id }}
          path: ${{ runner.temp }}/push38-homeqa-connector-parent-exit/
          if-no-files-found: error
          retention-days: 7
