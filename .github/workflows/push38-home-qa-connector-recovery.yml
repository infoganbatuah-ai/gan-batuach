name: PUSH 38 Connector recovery Home QA manifest

on:
  push:
    branches: [codex/push-38-aws-signing]
    paths:
      - .github/workflows/push38-home-qa-connector-recovery.yml

permissions: {}
concurrency:
  group: push38-home-qa-connector-recovery-manifest
  cancel-in-progress: false

jobs:
  issue-connector-recovery-manifest:
    if: github.repository == 'infoganbatuah-ai/gan-batuach' && github.ref == 'refs/heads/codex/push-38-aws-signing'
    environment: HOME_QA_SIGNING
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 871a06c7924634e20a42855bac8029bb52a7619e
          persist-credentials: false
      - name: Require the reviewed qualification tooling
        run: test "$(git rev-parse HEAD)" = "871a06c7924634e20a42855bac8029bb52a7619e"
      - name: Verify immutable recovery issuance contract
        run: |
          node scripts/qa/check-push38-home-qa-issuance.mjs
          node scripts/qa/check-edge-ota-update.mjs
          node scripts/qa/check-remote-edge-signer.mjs
          node scripts/qa/check-installed-ota-health-truth.mjs
      - name: Assume exact protected release-signing role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: homeqa-recovery-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 2
          unset-current-credentials: true
      - name: Sign exact-device Connector recovery manifest
        env:
          SIGNER_KEY_ARN: ${{ vars.AWS_KEY_ARN }}
          SIGNER_KEY_ID: ${{ vars.SIGNER_KEY_ID }}
          SIGNER_PUBLIC_KEY_SHA256: ${{ vars.SIGNER_PUBLIC_KEY_SHA256 }}
          PUSH38_CANDIDATE_SHA: 24a100a85ac6cd5021cdba8fcc85d0a9748d017d
          HOME_QA_R2_ORIGIN: https://693f824a750afcc264fe6ee58c8a86ab.r2.cloudflarestorage.com
          HOME_QA_OUTPUT_DIR: ${{ runner.temp }}/push38-homeqa-connector-recovery
        run: node scripts/release/issue-push38-home-qa-connector-recovery.mjs
      - name: Preserve signed public manifest and redacted evidence
        uses: actions/upload-artifact@v4
        with:
          name: push38-homeqa-connector-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/push38-homeqa-connector-recovery/
          if-no-files-found: error
          retention-days: 7
