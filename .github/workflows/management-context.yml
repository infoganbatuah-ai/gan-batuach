name: Management tenant context
on:
  pull_request:
  push:
    branches: [main, master, 'codex/gb-m*-*']
permissions:
  contents: read
jobs:
  management-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/qa/check-management-garden-context.mjs
      - run: node --test scripts/qa/check-management-operational-role.mjs
      - run: node --test scripts/qa/check-management-contact-verification.mjs
      - run: node --test scripts/qa/check-management-signed-invitations.mjs
      - run: node --test scripts/qa/check-management-parent-invitation-acceptance.mjs
      - run: node --test scripts/qa/check-management-canonical-family-linking.mjs
      - run: node --test scripts/qa/check-management-owner-teacher-semantics.mjs
      - run: node --test scripts/qa/check-management-multi-garden-owner-context.mjs
      - run: node --test scripts/qa/check-management-atomic-onboarding.mjs
      - run: node --test scripts/qa/check-management-canonical-classrooms.mjs
      - run: node --test scripts/qa/check-management-staff-candidate-job-discovery.mjs
      - run: node --test scripts/qa/check-management-staff-hiring-lifecycle.mjs
      - run: node --test scripts/qa/check-management-multi-garden-staff.mjs
      - run: node --test scripts/qa/check-management-inspector-approval.mjs
      - run: node --test scripts/qa/check-management-inspector-garden-bootstrap.mjs
      - run: node --test scripts/qa/check-management-complaints-sla.mjs
      - run: node --test scripts/qa/check-management-platform-subscriptions.mjs
      - run: npm run qa:manager-parent-live-contract
