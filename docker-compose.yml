name: gan-batuach

services:
  video-gateway:
    build:
      context: ./services/video-gateway
      dockerfile: Dockerfile
    image: gan-batuach-video-gateway:local
    profiles: ["gateway"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production.local
    environment:
      NODE_ENV: production
      PORT: "8080"
      DVR_EXPECTED_CHANNEL_COUNT: "16"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gan-batuach:local
    ports:
      - "3000:3000"
    env_file:
      - .env.production.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  reverse-proxy:
    image: nginx:alpine
    profiles: ["proxy"]
    ports:
      - "8080:80"
    depends_on:
      web:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;
          location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        EOF
        nginx -g 'daemon off;'
