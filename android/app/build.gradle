import groovy.json.JsonSlurper
apply plugin: 'com.android.application'

android {
    namespace = "com.ganbatuach.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ganbatuach.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // A local QA APK must never replace the installed release package.
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// cap sync and Gradle are separate steps. Refuse a stale or wrong-profile
// capacitor.config.json before packaging a QA or release artifact.
def verifyMobileConfig = { String buildType ->
    def packedConfig = file('src/main/assets/capacitor.config.json')
    if (!packedConfig.isFile()) throw new GradleException('CAPACITOR_SYNC_REQUIRED')
    def config = new JsonSlurper().parse(packedConfig)
    def profile = System.getenv('CAPACITOR_BUILD_PROFILE') ?: 'development'
    def expectedUrl = System.getenv('CAPACITOR_SERVER_URL')
    if (!expectedUrl || config.server?.url != expectedUrl) throw new GradleException('CAPACITOR_SERVER_URL_MISMATCH')
    if (buildType == 'release' && profile != 'release') throw new GradleException('CAPACITOR_RELEASE_PROFILE_REQUIRED')
    if (buildType == 'debug' && !(profile in ['development', 'qa'])) throw new GradleException('CAPACITOR_DEBUG_PROFILE_REQUIRED')
    def expectedAppId = buildType == 'release' ? 'com.ganbatuach.app' : 'com.ganbatuach.app.qa'
    if (config.appId != expectedAppId) throw new GradleException('CAPACITOR_APP_ID_MISMATCH')
    def url = new URI(expectedUrl)
    def origin = "${url.scheme}://${url.authority}"
    if (profile != 'development' || url.scheme == 'https') {
        if (url.scheme != 'https' || origin != System.getenv('CAPACITOR_ALLOWED_SERVER_ORIGIN') || config.server.cleartext != false)
            throw new GradleException('CAPACITOR_APPROVED_HTTPS_REQUIRED')
    } else if (url.scheme != 'http' || !(url.host in ['localhost', '127.0.0.1']) || config.server.cleartext != true) {
        throw new GradleException('CAPACITOR_LOCAL_URL_INVALID')
    }
}
tasks.register('verifyDebugMobileConfig') { doLast { verifyMobileConfig('debug') } }
tasks.register('verifyReleaseMobileConfig') { doLast { verifyMobileConfig('release') } }
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn 'verifyDebugMobileConfig' }
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseMobileConfig' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
