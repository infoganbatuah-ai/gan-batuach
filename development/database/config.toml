# DEVELOPMENT / INTEGRATION only. Never link this project to Supabase Cloud.
project_id = "gan-batuach-integration"
[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55422
shadow_port = 55420
major_version = 17
health_timeout = "3m"
[db.migrations]
enabled = false
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[db.pooler]
enabled = false
port = 55429
[realtime]
enabled = true
[studio]
enabled = false
port = 55423
[local_smtp]
enabled = true
port = 55424
[storage]
enabled = true
file_size_limit = "10MiB"
[storage.s3_protocol]
enabled = false
[storage.analytics]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
# Enable the email/password provider; global auth.enable_signup=false still
# forbids public registrations. Only guarded admin-created QA identities exist.
enable_signup = true
enable_confirmations = false
[auth.sms]
enable_signup = false
enable_confirmations = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
